<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>selftest</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f1ea; font: 28px/1.5 'Malgun Gothic', sans-serif; color: #132c3d; }
  .slide { padding: 60px 80px; }
  pre { font: 24px/1.5 Consolas, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<section class="slide" id="s1" data-notes="self test of what the add-in page gives a deck">
  <h1>Self test</h1>
  <p><a id="hash" href="#out">hash link</a> · <a id="ext" href="https://example.com/">outside link</a></p>
  <pre id="out">running…</pre>
</section>
<script>
// Uses, on purpose, the things a sandboxed frame normally refuses. The add-in page must make them harmless.
(function () {
  var r = {};
  function t(name, fn) { try { r[name] = fn(); } catch (e) { r[name] = 'ERR ' + (e && e.name); } }
  t('slide', function () { return window.__LIVE_SLIDE__; });
  t('api', function () { return typeof window.liveSlide === 'object' && typeof liveSlide.next === 'function' && liveSlide.index; });
  t('ls', function () { localStorage.setItem('k', 'v1'); return localStorage.getItem('k'); });
  t('ss', function () { sessionStorage.setItem('k', 'v2'); return sessionStorage.getItem('k'); });
  t('ck', function () { document.cookie = 'a=1'; return typeof document.cookie; });
  t('al', function () { var a = Date.now(); alert('alert() from the deck'); return Date.now() - a < 500 ? 'no-block' : 'blocked'; });
  t('cf', function () { return confirm('ok?'); });
  t('pr', function () { return prompt('name?', 'dflt'); });
  t('hs', function () { history.replaceState({}, '', '#x'); return 'ok'; });
  t('wv', function () { return typeof (window.chrome && window.chrome.webview); });   // is the host object reachable from the deck?
  t('hash', function () { document.getElementById('hash').click(); return 'alive'; });
  t('ext', function () { document.getElementById('ext').click(); return 'alive'; });
  var s = JSON.stringify(r);
  document.getElementById('out').textContent = s.replace(/,/g, ',\n');
  document.title = 'SELFTEST ' + s;
})();
// Isolation check (results go to the test probe as "deck-office" events): from inside the deck's frame, try to reach
// PowerPoint the way the add-in page itself does. Expected: Office never becomes ready here and no document data is readable.
(function () {
  function report(o) { o.__probe = 1; o.ev = 'deck-office'; try { parent.postMessage(o, '*'); } catch (e) {} }
  var done = false;
  try { window.chrome.webview.postMessage('live-html-selftest'); report({ state: 'webview.postMessage did not throw' }); }
  catch (e) { report({ state: 'webview.postMessage threw', msg: String((e && e.message) || e).slice(0, 120) }); }
  try { report({ state: 'hostObjects', kind: typeof window.chrome.webview.hostObjects }); } catch (e2) { report({ state: 'hostObjects threw' }); }
  var sc = document.createElement('script');
  sc.src = 'https://appsforoffice.microsoft.com/lib/1/hosted/office.js';
  sc.onload = function () {
    try {
      Office.onReady(function (info) {
        if (done) { return; }
        done = true;
        var r = { state: 'office.js ready inside the deck', host: info && info.host, platform: info && info.platform };
        try { r.slide = Office.context.document.settings.get('slide'); r.htmlLen = (Office.context.document.settings.get('html') || '').length; }
        catch (e) { r.settingsErr = String((e && e.message) || e).slice(0, 120); }
        report(r);
      });
    } catch (e) { report({ state: 'Office.onReady threw', msg: String((e && e.message) || e).slice(0, 120) }); }
  };
  sc.onerror = function () { report({ state: 'office.js did not load' }); };
  setTimeout(function () { if (!done) { done = true; report({ state: 'office.js never became ready (10 s)', office: typeof window.Office }); } }, 10000);
  document.head.appendChild(sc);
})();
</script>
</body>
</html>
